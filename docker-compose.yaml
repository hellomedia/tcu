  # Claude code in container with no ssh access
  # ===========================================
  # Claude commits to git locally only.
  #
  # First time : docker compose build claude-code
  # Launch claude in container with a new conversation: 
  #          docker compose run --rm claude-code claude
  # Launch claude in container continuing previous conversation:
  #          docker compose run --rm claude-code claude -c 
  #
  # NB: --rm throws the container away when you exit, leaving nothing running.
  #
  # Stopping and starting containers doesn't lose Claude's memory of a project.
  # The context that matters lives in two persistent places — the CLAUDE.md, /.claude/
  # inside your repo (on disk, survives everything) and the session transcripts 
  # in the claude-config named volume (survives container stop/start, since named volumes persist independently of containers). 
  # So you can shut down HELLO KOT, bring it back up, and claude -c picks up where you left off.
  claude-code:
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
    build: ./docker/claude
    working_dir: /data/www
    profiles: ["claude"]                     # keeps it OUT of your normal "docker compose up"
    cap_add:
      - NET_ADMIN                            # egress allowlist firewall (docker/claude/init-firewall.sh)
    volumes:
      - "./:/data/www"                       # your code (Claude reads, edits, commits here)
      - "claude-config:/home/node/.claude"   # persists your Claude login. Named volume, /home/node is **inside** container, not on host
      # host-executed scripts mounted read-only over themselves: Nicolas
      # runs them outside this container with his own privileges, so they
      # must not be modifiable from inside. Read-only rather than hidden
      # (/dev/null shadow): hiding would make git see an emptied file — one
      # `git add` away from committing it — while the content is in git
      # history anyway; the protection that matters is on the files that
      # actually get executed. Verified 2026-07-31 from inside: append, rm,
      # mv and chmod all fail (a single-file mount point can't be unlinked
      # or replaced from its writable parent directory).
      - "./bin/deploy.sh:/data/www/bin/deploy.sh:ro"
      - "./bin/runqueue.sh:/data/www/bin/runqueue.sh:ro"
      - "./bin/webhook.sh:/data/www/bin/webhook.sh:ro"

# NAMED VOLUMES

volumes:
  db-data:
  db-pgadmin:
  claude-config:
  #shared_certs:  # not neeeded since we use http internally between nginx and caddy

# NB: Named Volumes vs Bind Mounts
# For Named Volumes, storage location is handled internally by docker.
# For bind mounts (in volumes section of the services), storage location is defined in this file.
# For example, we don't really care where db-data is stored, so it makes sense to let docker handle it internally.
# For sharing the code living on the host with the php container, however, we want to specify the location, so we use a bind mount.

